<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded blue tile -->
  <rect width="64" height="64" rx="14" fill="#0C67DF"/>

  <!-- Hammer group, rotated slightly for a natural angle -->
  <g transform="rotate(-35 32 32)">
    <!-- Handle -->
    <rect x="30" y="30" width="6" height="26" rx="2.5" fill="#ffffff"/>
    <!-- Grip band on handle -->
    <rect x="30" y="46" width="6" height="6" fill="#e6edf7"/>

    <!-- Head -->
    <path d="M14 16
             C14 13.8 15.8 12 18 12
             L46 12
             C48.2 12 50 13.8 50 16
             L50 26
             C50 28.2 48.2 30 46 30
             L18 30
             C15.8 30 14 28.2 14 26
             Z"
          fill="#ffffff"/>
    <!-- Claw notch on the left side of the head -->
    <path d="M14 18
             L20 21
             L14 24 Z"
          fill="#0C67DF"/>
  </g>
</svg>
